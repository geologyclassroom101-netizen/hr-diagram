<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-R Diagram Plotter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #2a3a55;
    --fg: #e8edf5;
    --fg2: #8a9bb8;
    --accent: #5b8dee;
    --accent2: #a78bfa;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    color-scheme: dark;

    /* Spectral class colors */
    --O: #9bb8ff;
    --B: #c8d8ff;
    --A: #f0f4ff;
    --F: #fff8e8;
    --G: #ffe87a;
    --K: #ffaa44;
    --M: #ff5a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.3px;
  }

  header .subtitle {
    font-size: 15px;
    color: var(--fg2);
    margin-left: auto;
  }

  .app {
    display: flex;
    flex: 1;
    gap: 0;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 310px;
    min-width: 310px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .input-panel {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .input-panel h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg2);
    margin-bottom: 14px;
  }

  .field {
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
  }

  input[type="text"], input[type="number"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 9px 11px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--accent);
  }

  select option { background: var(--surface); }

  .spectral-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .spec-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--fg2);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 9px 0;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
  }

  .spec-btn:hover { border-color: var(--accent); color: var(--fg); }
  .spec-btn.active { color: #000; font-weight: 700; }
  .spec-btn[data-class="O"].active { background: var(--O); border-color: var(--O); }
  .spec-btn[data-class="B"].active { background: var(--B); border-color: var(--B); }
  .spec-btn[data-class="A"].active { background: var(--A); border-color: var(--A); }
  .spec-btn[data-class="F"].active { background: var(--F); border-color: var(--F); }
  .spec-btn[data-class="G"].active { background: var(--G); border-color: var(--G); }
  .spec-btn[data-class="K"].active { background: var(--K); border-color: var(--K); color: #000; }
  .spec-btn[data-class="M"].active { background: var(--M); border-color: var(--M); color: #fff; }

  .plot-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 7px;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.15s, transform 0.1s;
  }

  .plot-btn:hover { opacity: 0.9; }
  .plot-btn:active { transform: scale(0.98); }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 6px;
    min-height: 16px;
  }

  /* ── Star list ── */
  .star-list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .star-list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .star-list-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg2);
  }

  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--fg2);
    font-size: 13px;
    font-weight: 600;
    padding: 2px 8px;
  }

  .star-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
    transition: border-color 0.12s;
  }

  .star-item:hover { border-color: var(--accent); }

  .star-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .star-info { flex: 1; min-width: 0; }

  .star-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .star-meta {
    font-size: 12px;
    color: var(--fg2);
    font-variant-numeric: tabular-nums;
  }

  .star-actions { display: flex; gap: 4px; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--fg2);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 15px;
    transition: color 0.12s, background 0.12s;
  }

  .icon-btn:hover { color: var(--fg); background: var(--border); }
  .icon-btn.del:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    color: var(--fg2);
    font-size: 14px;
    padding: 24px 0;
    line-height: 1.6;
  }

  /* ── Export ── */
  .export-panel {
    padding: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .export-btn {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 9px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    text-align: center;
  }

  .export-btn:hover { border-color: var(--success); color: var(--success); }

  /* ── Diagram area ── */
  .diagram-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: auto;
  }

  canvas#hr {
    border-radius: 10px;
    max-width: 100%;
  }

  /* ── Edit modal ── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 300px;
    max-width: 90vw;
  }

  .modal h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .btn-cancel {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 9px;
    cursor: pointer;
  }

  .btn-save {
    flex: 1;
    background: var(--accent);
    border: none;
    border-radius: 7px;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 9px;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); }
    .diagram-wrap { padding: 12px; }
  }
</style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
    <circle cx="11" cy="11" r="10" fill="none" stroke="#5b8dee" stroke-width="1.5"/>
    <circle cx="11" cy="11" r="3" fill="#ffe87a"/>
    <circle cx="4" cy="6" r="1.5" fill="#9bb8ff"/>
    <circle cx="17" cy="15" r="2" fill="#ff5a2a"/>
    <circle cx="16" cy="5" r="1" fill="#c8d8ff"/>
    <circle cx="5" cy="16" r="1" fill="#ffaa44"/>
  </svg>
  <h1>H-R Diagram Plotter</h1>
  <span class="subtitle">Las Positas College · Astronomy</span>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="input-panel">
      <h2>Add a Star</h2>

      <div class="field">
        <label>Star Name</label>
        <input type="text" id="starName" placeholder="e.g. Sun, Sirius, Betelgeuse" maxlength="40">
      </div>

      <div class="field">
        <label>Spectral Class</label>
        <div class="spectral-row" id="spectralRow">
          <button class="spec-btn" data-class="O">O</button>
          <button class="spec-btn" data-class="B">B</button>
          <button class="spec-btn" data-class="A">A</button>
          <button class="spec-btn" data-class="F">F</button>
          <button class="spec-btn" data-class="G">G</button>
          <button class="spec-btn" data-class="K">K</button>
          <button class="spec-btn" data-class="M">M</button>
        </div>
      </div>

      <div class="field">
        <label>Absolute Magnitude</label>
        <input type="number" id="absMag" placeholder="−10 (bright) to +17 (dim)" step="0.1" min="-10" max="17">
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button class="plot-btn" id="plotBtn">Plot Star</button>
    </div>

    <!-- Star list -->
    <div class="star-list-wrap">
      <div class="star-list-header">
        <h2>Plotted Stars</h2>
        <span class="count-badge" id="countBadge">0 / 20</span>
      </div>
      <div id="starList"><div class="empty-state">No stars plotted yet.<br>Add your first star above.</div></div>
    </div>

    <!-- Export -->
    <div class="export-panel">
      <button class="export-btn" id="exportBtn">⬇ Download as PNG</button>
    </div>
  </div>

  <!-- Diagram -->
  <div class="diagram-wrap">
    <canvas id="hr"></canvas>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-bg" id="modalBg" style="display:none">
  <div class="modal">
    <h3>Edit Star</h3>
    <div class="field">
      <label>Star Name</label>
      <input type="text" id="editName" maxlength="40">
    </div>
    <div class="field">
      <label>Spectral Class</label>
      <div class="spectral-row" id="editSpectralRow">
        <button class="spec-btn" data-class="O">O</button>
        <button class="spec-btn" data-class="B">B</button>
        <button class="spec-btn" data-class="A">A</button>
        <button class="spec-btn" data-class="F">F</button>
        <button class="spec-btn" data-class="G">G</button>
        <button class="spec-btn" data-class="K">K</button>
        <button class="spec-btn" data-class="M">M</button>
      </div>
    </div>
    <div class="field">
      <label>Absolute Magnitude</label>
      <input type="number" id="editMag" step="0.1" min="-10" max="17">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelEdit">Cancel</button>
      <button class="btn-save" id="saveEdit">Save</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const MAX_STARS = 20;
const SPECTRAL = ['O','B','A','F','G','K','M'];
const SPEC_COLORS = { O:'#9bb8ff', B:'#c8d8ff', A:'#eef2ff', F:'#fff8e8', G:'#ffe87a', K:'#ffaa44', M:'#ff5a2a' };
const MAG_MIN = -10, MAG_MAX = 17;

let stars = [];
let selectedSpec = null;
let editIdx = null;
let editSpec = null;

// ── Canvas setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('hr');
const ctx = canvas.getContext('2d');

// Diagram margins and size
const W = 820, H = 700;
const ML = 76, MR = 28, MT = 100, MB = 62;
const PW = W - ML - MR;
const PH = H - MT - MB;

canvas.width = W;
canvas.height = H;

// Map spectral class to x position (0-6 → 0-PW)
function specToX(spec) {
  const i = SPECTRAL.indexOf(spec);
  // Inset by 20px on each side so stars never land on the border
  return ML + 20 + (i / 6) * (PW - 40);
}

// Map absolute magnitude to y position
function magToY(mag) {
  return MT + ((mag - MAG_MIN) / (MAG_MAX - MAG_MIN)) * PH;
}

// ── Draw diagram ───────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#080c18');
  bgGrad.addColorStop(1, '#0d1120');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle star field
  ctx.save();
  const seed = 42;
  for (let i = 0; i < 120; i++) {
    const sx = pseudoRand(seed + i * 7) * W;
    const sy = pseudoRand(seed + i * 13) * H;
    const sr = pseudoRand(seed + i * 3) * 0.8 + 0.2;
    const alpha = pseudoRand(seed + i * 11) * 0.3 + 0.05;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.fill();
  }
  ctx.restore();

  // Plot area border
  ctx.strokeStyle = '#2a3a55';
  ctx.lineWidth = 1;
  ctx.strokeRect(ML, MT, PW, PH);

  // Grid lines — magnitude
  const magTicks = [-10,-5,0,5,10,15,17];
  ctx.textAlign = 'right';
  ctx.font = '16px Inter, sans-serif';
  for (const m of magTicks) {
    const y = magToY(m);
    ctx.beginPath();
    ctx.moveTo(ML, y);
    ctx.lineTo(ML + PW, y);
    ctx.strokeStyle = 'rgba(80,110,160,0.5)';
    ctx.lineWidth = 0.75;
    ctx.stroke();
    ctx.fillStyle = '#c0d0e8';
    ctx.fillText(m >= 0 ? '+' + m : m, ML - 8, y + 4);
  }

  // Grid lines — spectral class columns
  for (let i = 0; i < 7; i++) {
    const x = ML + (i / 6) * PW;
    ctx.beginPath();
    ctx.moveTo(x, MT);
    ctx.lineTo(x, MT + PH);
    ctx.strokeStyle = 'rgba(80,110,160,0.4)';
    ctx.lineWidth = 0.75;
    ctx.stroke();
  }

  // Spectral class labels (x-axis top and bottom)
  const specLabels = [
    { label: 'O', temp: '≥30,000 K', color: '#9bb8ff' },
    { label: 'B', temp: '10,000 K',  color: '#c8d8ff' },
    { label: 'A', temp: '7,500 K',   color: '#eef2ff' },
    { label: 'F', temp: '6,000 K',   color: '#fff8e8' },
    { label: 'G', temp: '5,200 K',   color: '#ffe87a' },
    { label: 'K', temp: '3,700 K',   color: '#ffaa44' },
    { label: 'M', temp: '≤3,000 K',  color: '#ff5a2a' },
  ];

  ctx.textAlign = 'center';
  for (let i = 0; i < 7; i++) {
    const x = ML + (i / 6) * PW;
    const sl = specLabels[i];

    // Colored class letter
    ctx.font = 'bold 21px Space Grotesk, sans-serif';
    ctx.fillStyle = sl.color;
    ctx.fillText(sl.label, x, MT - 36);

    // Temperature below
    ctx.font = '13px Inter, sans-serif';
    ctx.fillStyle = '#8aabcc';
    ctx.fillText(sl.temp, x, MT - 20);

    // Bottom label
    ctx.font = 'bold 19px Space Grotesk, sans-serif';
    ctx.fillStyle = sl.color;
    ctx.fillText(sl.label, x, MT + PH + 22);
  }

  // Axis labels — y-axis rotated
  ctx.save();
  ctx.translate(16, MT + PH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.font = '19px Space Grotesk, sans-serif';
  ctx.fillStyle = '#e0e8f5';
  ctx.fillText('Absolute Magnitude', 0, 0);
  ctx.restore();

  // "BRIGHT" at top, "DIM" at bottom — inside the plot area
  ctx.save();
  ctx.font = 'bold 15px Inter, sans-serif';
  ctx.fillStyle = '#ffe87a';
  ctx.textAlign = 'left';
  ctx.fillText('▲ BRIGHT', ML + 6, MT + 20);
  ctx.fillStyle = '#ff8866';
  ctx.fillText('▼ DIM', ML + 6, MT + PH - 8);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = '19px Space Grotesk, sans-serif';
  ctx.fillStyle = '#c0d0e8';
  ctx.fillText('(← hotter)   Spectral Class', ML + PW / 2, MT + PH + 46);

  // Title
  ctx.font = 'bold 21px Space Grotesk, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.fillText('Hertzsprung–Russell Diagram', ML, MT - 62);

  // Clip to plot area for star drawing
  ctx.save();
  ctx.beginPath();
  ctx.rect(ML, MT, PW, PH);
  ctx.clip();

  // Draw reference regions (subtle)
  drawRegions();

  // Draw stars
  for (let i = 0; i < stars.length; i++) {
    drawStar(stars[i], i);
  }

  ctx.restore();

  // Star count
  ctx.textAlign = 'right';
  ctx.font = '10px Inter, sans-serif';
  ctx.fillStyle = '#8aabcc';
  ctx.fillText(`${stars.length} / ${MAX_STARS} stars`, W - MR, H - 6);
}

function drawRegions() {
  // Main sequence band (rough diagonal)
  const msGrad = ctx.createLinearGradient(ML, MT, ML + PW, MT + PH);
  msGrad.addColorStop(0, 'rgba(91,141,238,0.22)');
  msGrad.addColorStop(1, 'rgba(255,90,42,0.22)');
  ctx.beginPath();
  // Main sequence: O at top-left, M at bottom-right
  ctx.moveTo(ML, MT + PH * 0.0);
  ctx.lineTo(ML + PW * 0.15, MT + PH * 0.08);
  ctx.lineTo(ML + PW * 1.0, MT + PH * 0.75);
  ctx.lineTo(ML + PW * 1.0, MT + PH * 0.95);
  ctx.lineTo(ML + PW * 0.6, MT + PH * 0.6);
  ctx.lineTo(ML, MT + PH * 0.15);
  ctx.closePath();
  ctx.fillStyle = msGrad;
  ctx.fill();

  // Region labels — full opacity for accessibility
  ctx.font = 'bold italic 22px Space Grotesk, sans-serif';
  ctx.fillStyle = '#a8c0f0';
  ctx.textAlign = 'center';
  ctx.fillText('Main Sequence', ML + PW * 0.6, MT + PH * 0.45);

  // --- Giants region ---
  // Sits above/right of main sequence. Main sequence runs roughly from
  // (0, 0.08) top-left to (1.0, 0.82) bottom-right, so giants must stay
  // well above that diagonal. Giants are cool (right side) and bright (Mv -1 to -3).
  // We use a radial gradient to get a soft fuzzy edge.
  (function() {
    const cx = ML + PW * 0.76, cy = MT + PH * 0.27;
    const rx = PW * 0.20, ry = PH * 0.08;
    ctx.save();
    ctx.scale(1, ry / rx); // squash circle into ellipse
    const grd = ctx.createRadialGradient(cx, cy * (rx/ry), 0, cx, cy * (rx/ry), rx);
    grd.addColorStop(0,   'rgba(255,170,60,0.32)');
    grd.addColorStop(0.5, 'rgba(255,170,60,0.18)');
    grd.addColorStop(1,   'rgba(255,170,60,0)');
    ctx.beginPath();
    ctx.arc(cx, cy * (rx/ry), rx, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();
  })();
  ctx.font = 'bold italic 22px Space Grotesk, sans-serif';
  ctx.fillStyle = '#ffb84d';
  ctx.textAlign = 'center';
  ctx.fillText('Giants', ML + PW * 0.76, MT + PH * 0.285);

  // --- Supergiants region ---
  // Even brighter (Mv -3 to -8), spans full width but centered toward cool side.
  // Placed clearly above the giant blob and well above the main sequence.
  (function() {
    const cx = ML + PW * 0.55, cy = MT + PH * 0.11;
    const rx = PW * 0.38, ry = PH * 0.07;
    ctx.save();
    ctx.scale(1, ry / rx);
    const grd = ctx.createRadialGradient(cx, cy * (rx/ry), 0, cx, cy * (rx/ry), rx);
    grd.addColorStop(0,   'rgba(200,120,255,0.30)');
    grd.addColorStop(0.5, 'rgba(200,120,255,0.16)');
    grd.addColorStop(1,   'rgba(200,120,255,0)');
    ctx.beginPath();
    ctx.arc(cx, cy * (rx/ry), rx, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();
  })();
  ctx.font = 'bold italic 22px Space Grotesk, sans-serif';
  ctx.fillStyle = '#d088ff';
  ctx.textAlign = 'center';
  ctx.fillText('Supergiants', ML + PW * 0.55, MT + PH * 0.122);

  // White dwarf region (lower left)
  ctx.font = 'bold italic 22px Space Grotesk, sans-serif';
  ctx.fillStyle = '#c8dcff';
  ctx.textAlign = 'center';
  ctx.fillText('White Dwarfs', ML + PW * 0.18, MT + PH * 0.88);

  // Red dwarf region (lower right)
  ctx.font = 'bold italic 22px Space Grotesk, sans-serif';
  ctx.fillStyle = '#ff7850';
  ctx.textAlign = 'center';
  ctx.fillText('Red Dwarfs', ML + PW * 0.82, MT + PH * 0.88);
}

function drawStar(star, idx) {
  const x = specToX(star.spec);
  const y = magToY(star.mag);
  const color = SPEC_COLORS[star.spec];
  // Size by stellar type: Giants = bright+cool, Dwarfs = dim, Main sequence = default
  const specIdx = SPECTRAL.indexOf(star.spec); // 0=O(hot) … 6=M(cool)
  const isGiant    = star.mag <= -1 && specIdx >= 3;          // bright, cool K/M/F/G
  const isDwarf    = star.mag >= 8;                           // dim (white or red dwarf)
  const r = isGiant ? 20 : isDwarf ? 7 : 10;

  // Glow using shadowBlur
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();


  // Name label
  ctx.save();
  ctx.font = 'bold 14px Inter, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(8,12,24,0.95)';
  ctx.lineWidth = 3;
  ctx.textAlign = 'left';

  let lx = x + r + 4;
  let ly = y - 2;
  // Keep label inside plot area
  if (lx + ctx.measureText(star.name).width > ML + PW - 4) {
    ctx.textAlign = 'right';
    lx = x - r - 4;
  }
  ctx.strokeText(star.name, lx, ly);
  ctx.fillText(star.name, lx, ly);
  ctx.restore();
}

function pseudoRand(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

// ── Spectral selector ──────────────────────────────────────────────────────
function setupSpectralRow(rowId, getSelected, setSelected) {
  const row = document.getElementById(rowId);
  row.querySelectorAll('.spec-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setSelected(btn.dataset.class);
      row.querySelectorAll('.spec-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

setupSpectralRow('spectralRow', () => selectedSpec, (v) => { selectedSpec = v; });
setupSpectralRow('editSpectralRow', () => editSpec, (v) => { editSpec = v; });

// ── Plot button ────────────────────────────────────────────────────────────
document.getElementById('plotBtn').addEventListener('click', () => {
  const name = document.getElementById('starName').value.trim();
  const mag = parseFloat(document.getElementById('absMag').value);
  const err = document.getElementById('errorMsg');

  if (!name) { err.textContent = 'Please enter a star name.'; return; }
  if (!selectedSpec) { err.textContent = 'Please select a spectral class.'; return; }
  if (isNaN(mag) || mag < MAG_MIN || mag > MAG_MAX) {
    err.textContent = `Magnitude must be between ${MAG_MIN} and +${MAG_MAX}.`; return;
  }
  if (stars.length >= MAX_STARS) { err.textContent = `Maximum ${MAX_STARS} stars reached.`; return; }

  err.textContent = '';
  stars.push({ name, spec: selectedSpec, mag });

  // Reset inputs
  document.getElementById('starName').value = '';
  document.getElementById('absMag').value = '';
  selectedSpec = null;
  document.getElementById('spectralRow').querySelectorAll('.spec-btn').forEach(b => b.classList.remove('active'));

  renderList();
  draw();
});

// Enter key on inputs
['starName','absMag'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('plotBtn').click();
  });
});

// ── Star list ──────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('starList');
  document.getElementById('countBadge').textContent = `${stars.length} / ${MAX_STARS}`;

  if (stars.length === 0) {
    list.innerHTML = '<div class="empty-state">No stars plotted yet.<br>Add your first star above.</div>';
    return;
  }

  list.innerHTML = stars.map((s, i) => `
    <div class="star-item">
      <div class="star-dot" style="background:${SPEC_COLORS[s.spec]}; box-shadow: 0 0 6px ${SPEC_COLORS[s.spec]}"></div>
      <div class="star-info">
        <div class="star-name">${escHtml(s.name)}</div>
        <div class="star-meta">Class ${s.spec} · M = ${s.mag >= 0 ? '+' : ''}${s.mag.toFixed(1)}</div>
      </div>
      <div class="star-actions">
        <button class="icon-btn" title="Edit" onclick="openEdit(${i})">✏</button>
        <button class="icon-btn del" title="Delete" onclick="deleteStar(${i})">✕</button>
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.deleteStar = function(idx) {
  stars.splice(idx, 1);
  renderList();
  draw();
};

// ── Edit modal ─────────────────────────────────────────────────────────────
window.openEdit = function(idx) {
  editIdx = idx;
  const s = stars[idx];
  document.getElementById('editName').value = s.name;
  document.getElementById('editMag').value = s.mag;
  editSpec = s.spec;
  document.getElementById('editSpectralRow').querySelectorAll('.spec-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.class === s.spec);
  });
  document.getElementById('modalBg').style.display = 'flex';
};

function closeModal() {
  document.getElementById('modalBg').style.display = 'none';
}

document.getElementById('cancelEdit').addEventListener('click', closeModal);

document.getElementById('saveEdit').addEventListener('click', () => {
  const name = document.getElementById('editName').value.trim();
  const mag = parseFloat(document.getElementById('editMag').value);
  if (!name || !editSpec || isNaN(mag) || mag < MAG_MIN || mag > MAG_MAX) return;
  stars[editIdx] = { name, spec: editSpec, mag };
  closeModal();
  renderList();
  draw();
});

document.getElementById('modalBg').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalBg')) closeModal();
});

// ── Export ─────────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  // Draw to a fresh offscreen canvas with white bg for PNG
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.drawImage(canvas, 0, 0);

  const dataUrl = off.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'hr-diagram.png';
  a.click();
});

// ── Init ───────────────────────────────────────────────────────────────────
draw();
</script>
